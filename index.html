<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comparación: con JS vs sin JS</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body class="dividida">

  <!-- LADO IZQUIERDO: página SIN JavaScript -->
  <div class="lado">
    <h3 class="rotulo sin">SIN JavaScript (solo HTML + CSS)</h3>
    <iframe src="sin-js.html"></iframe>
  </div>

  <!-- LADO DERECHO: página CON JavaScript -->
  <div class="lado">
    <h3 class="rotulo con">CON JavaScript (HTML + CSS + JS)</h3>
    <iframe src="con-js.html"></iframe>
  </div>

</body>
</html>
